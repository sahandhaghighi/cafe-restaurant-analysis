<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Café-restaurant: sales review (public version)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F3F7;--surface:#FFFFFF;--ink:#25182A;--muted:#6E6072;--line:#E3DAE6;
  --accent:#B3306F;--accent-soft:#F3DDE8;--saffron:#B77A0C;--saffron-soft:#F6E8C8;--bar:#3D2A45;--bar-off:#DCD2E0;
  --font:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#18111D;--surface:#221829;--ink:#F2EAF4;--muted:#A897AD;--line:#3A2D42;
  --accent:#E4679F;--accent-soft:#4A2336;--saffron:#E3AC3F;--saffron-soft:#43341A;--bar:#CDBBD5;--bar-off:#3A2D42;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#18111D;--surface:#221829;--ink:#F2EAF4;--muted:#A897AD;--line:#3A2D42;
  --accent:#E4679F;--accent-soft:#4A2336;--saffron:#E3AC3F;--saffron-soft:#43341A;--bar:#CDBBD5;--bar-off:#3A2D42;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-snap-type:y mandatory;overflow-y:auto;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{height:100vh;height:100dvh;scroll-snap-align:start;display:flex;flex-direction:column;padding:clamp(12px,2.2vh,28px) clamp(14px,3vw,48px);gap:clamp(8px,1.6vh,18px);overflow:hidden;max-width:1440px;margin:0 auto}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-weight:600;font-size:14px;white-space:nowrap}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* headline */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:600;font-size:clamp(22px,3.2vw,44px);line-height:1.04;letter-spacing:-.02em}
h1 small{display:block;font-size:clamp(13px,1.1vw,15px);font-weight:400;letter-spacing:0;color:var(--muted);margin-top:6px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.offbtn{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.offbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--saffron);display:none}
.offbtn.custom .dot{display:inline-block}
/* main grid */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(12px,2.4vw,40px)}
.kpis{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr auto;border-top:1px solid var(--ink);min-height:0}
.months{grid-column:1/-1;padding:clamp(8px,1.6vh,16px) 0;border-bottom:1px solid var(--line)}
.months table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.1vw,15px)}
.months th{font-weight:400;color:var(--muted);text-align:left;padding:3px 8px 3px 0;font-size:13px}
.months td{padding:3px 8px 3px 0;white-space:nowrap}
.months td b{font-weight:600}
.months td span{color:var(--muted);margin-left:6px}
.months .b{color:var(--accent)} .months .w{color:var(--saffron)}
.kpi{padding:clamp(6px,1.3vh,14px) 12px clamp(6px,1.3vh,14px) 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:0}
.kpi:nth-child(odd){border-right:1px solid var(--line)}
.kpi:nth-child(even){padding-left:14px}
.kpi .lab{font-size:13px;color:var(--muted)}
.kpi .val{font-size:clamp(20px,2.4vw,34px);font-weight:600;letter-spacing:-.015em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi .pair{display:flex;flex-direction:column;gap:2px}
.kpi .pair div{font-size:clamp(14px,1.25vw,17px);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .pair em{font-style:normal;color:var(--muted);font-weight:400;font-size:13px}
.best .val,.best .pair div b{color:var(--accent)} .worst .pair div b{color:var(--saffron)}
.right{display:flex;flex-direction:column;min-height:0;gap:clamp(8px,1.5vh,16px)}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panelhead h2{margin:0;font-size:15px;font-weight:600}
.chart{flex:1 1 50%;min-height:120px;display:flex;flex-direction:column;border-top:1px solid var(--ink);padding-top:8px}
.chart svg{flex:1;min-height:0;width:100%;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rank{flex:0 0 auto;display:flex;flex-direction:column;border-top:1px solid var(--ink);padding-top:8px}
.rank ol{list-style:none;margin:4px 0 0;padding:0}
.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:clamp(3px,.7vh,7px) 0}
.rank .n{color:var(--muted);font-size:13px}
.rank .nm{min-width:0}
.rank .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.rank .nm small{color:var(--muted);font-size:12px;margin-left:6px;font-weight:400}
.rank .track{height:5px;background:var(--line);border-radius:3px;margin-top:3px;overflow:hidden}
.rank .track span{display:block;height:100%;background:var(--accent);border-radius:3px}
.rank.bottom .track span{background:var(--saffron)}
.rank .v{font-weight:600;font-size:14.5px;text-align:right;white-space:nowrap}
.offer{font-size:12.5px;color:var(--muted);margin-top:6px}
.offer .linkbtn{color:var(--accent);font-size:12.5px}
.offer .aboutm{display:none;color:var(--muted);margin-left:8px}
@media (max-width:820px){.offer .aboutm{display:inline}}
.offer .dot{display:none;width:7px;height:7px;border-radius:50%;background:var(--saffron);margin-left:4px;vertical-align:1px}
.offer.custom .dot{display:inline-block}
.foot{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);align-items:center}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--muted);font-size:12.5px}
/* dialogs */
dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:0;width:min(760px,94vw);max-height:88vh;max-height:88dvh}
dialog::backdrop{background:rgba(20,10,25,.45)}
.dlg{display:flex;flex-direction:column;max-height:88vh;max-height:88dvh}
.dlg header{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.dlg header h3{margin:0 0 4px;font-size:19px;font-weight:600}
.dlg header p{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch}
.dlg .body{overflow-y:auto;padding:6px 18px}
.dlg footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.orow .nm{font-weight:500}
.orow .meta{font-size:12.5px;color:var(--muted)}
.orow select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 8px;font-size:13.5px;max-width:48vw}
.orow.changed select{border-color:var(--saffron);box-shadow:0 0 0 1px var(--saffron)}
.badge{font-size:12.5px;color:var(--saffron);font-weight:600}
.notes p{margin:10px 0;font-size:14px;max-width:72ch}
@media (max-width:820px){
  body{font-size:14px}
  .page{gap:8px}
  .brand span{display:none}
  .head{gap:8px}
  h1 small{margin-top:3px}
  .controls{width:100%;flex-wrap:nowrap}
  .chips{flex:1}
  .page{overflow-y:auto}
  h1{font-size:19.5px;letter-spacing:-.01em}
  h1 small{font-size:12px}
  .chip{padding:5px 10px;font-size:13px}
  .foot{display:none}
  .panelhead h2{font-size:13.5px}
  .main{grid-template-columns:1fr;display:flex;flex-direction:column;gap:8px}
  .right{flex:1;min-height:0}
  .legend{display:none}
  .months{padding:5px 0}
  .months table{font-size:12.5px}
  .months th{font-size:12px}
  .kpis{grid-template-rows:auto auto auto}
  .kpi{padding-top:5px;padding-bottom:5px}
  .kpi .val{font-size:20px}
  .kpi .lab,.kpi .sub,.kpi .pair em{font-size:12px}
  .kpi .pair div{font-size:13.5px}
  .chart{flex:1 1 auto;min-height:84px;padding-top:5px}
  .rank{padding-top:5px}
  .rank li{gap:6px;padding:1px 0}
  .rank .nm div{font-size:13.5px;line-height:1.25}
  .rank .track{height:4px;margin-top:2px}
  .kpi .val{line-height:1.05}
  .offer{margin-top:3px;font-size:12px}
  .rank .nm small{display:none}
  .rank .v{font-size:13.5px}
  .legend{font-size:11.5px;gap:10px}
  .panelhead h2{font-size:14px}
  .seg button{padding:3px 9px;font-size:12.5px}
  .foot .src{display:none}
}

.dots{position:fixed;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:5}
.dots a{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:block}
.dots a.on{background:var(--accent);border-color:var(--accent)}
.h1s{font-size:clamp(20px,2.5vw,34px)}
.pgsub{font-size:13px;color:var(--muted)}
/* page 2 */
.cats{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:clamp(8px,1.4vh,14px) 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:0;gap:4px;transition:border-color .15s}
.cat:hover{border-color:var(--accent)}
.cat.off{border-style:dashed;background:transparent}
.cat .cn{font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:6px}
.cat .cn span{color:var(--muted);font-weight:400;font-size:12.5px;white-space:nowrap}
.cat .cr{font-size:clamp(18px,1.9vw,26px);font-weight:600;letter-spacing:-.01em;line-height:1.1}
.sb{display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sb .tr{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.sb .tr i{display:block;height:100%;border-radius:3px}
.sb.r .tr i{background:var(--accent)} .sb.q .tr i{background:var(--bar)}
.sb b{font-weight:600;color:var(--ink);text-align:right}
.cat .ct{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.howto{border:0;background:transparent;padding:8px 4px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;gap:8px}
.howto p{margin:0}
/* detail dialog table */
.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th{font-weight:400;color:var(--muted);font-size:12.5px;text-align:right;padding:6px 0 6px 10px;position:sticky;top:0;background:var(--surface)}
.dt th:first-child,.dt td:first-child{text-align:left;padding-left:0}
.dt td{padding:7px 0 7px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.dt td.nmc{white-space:normal}
.dt td.nmc small{color:var(--muted);font-size:12px;margin-left:6px}
.dt tr.zero td{color:var(--saffron)}
.dt .mini{display:block;height:4px;background:var(--line);border-radius:2px;margin-top:3px}
.dt .mini i{display:block;height:100%;background:var(--accent);border-radius:2px}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted);margin-left:6px;white-space:nowrap}
.sumline{font-size:13.5px;color:var(--muted);margin-top:6px}
/* page 3 */
.p3{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(12px,2.4vw,36px)}
.sc{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--ink);padding-top:8px;gap:6px;position:relative}
.sc svg{flex:1;min-height:0;width:100%;display:block}
.fchips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.fchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.fchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;padding:6px 9px;border-radius:8px;max-width:220px;display:none;z-index:3;line-height:1.35}
.low{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--ink);padding-top:8px;gap:6px}
.low .ctrl{display:flex;align-items:center;gap:10px;font-size:13.5px}
.low input[type=range]{flex:1;accent-color:var(--accent)}
.low .lsum{font-size:13.5px}
.low .lsum b{font-weight:600}
.low ul{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0}
.low li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.low li small{display:block;color:var(--muted);font-size:12px}
.low li .pm{text-align:right;font-weight:600}
.low li .pm small{font-weight:400}
@media (max-width:820px){
  .dots{display:none}
  .cats{grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,minmax(0,1fr));gap:6px}
  .cat{padding:6px 9px;border-radius:9px;gap:2px}
  .cat .cn{font-size:13px}.cat .cn span{display:none}
  .cat .cr{font-size:16px}
  .cat .ct,.howto{display:none}
  .sb{grid-template-columns:40px 1fr 34px;font-size:11px;gap:4px}
  .sb .tr{height:5px}
  .p3{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.25fr) minmax(0,1fr);gap:8px}
  .h1s{font-size:18px}
  .low .lsum{font-size:12.5px}
  .low li{padding:4px 0;font-size:13px}
  .dt{font-size:13px}.dt .hidem{display:none}
  dialog{width:100vw;max-width:100vw;max-height:92dvh;margin-bottom:0;border-radius:14px 14px 0 0}
}


.pA{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(12px,2.4vw,36px)}
.pc{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--ink);padding-top:8px;gap:6px}
.pc svg{flex:1;min-height:0;width:100%;display:block}
.side{display:flex;flex-direction:column;min-height:0;gap:clamp(8px,1.5vh,16px)}
.facts{border-top:1px solid var(--ink)}
.fact{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;padding:clamp(6px,1.1vh,11px) 0;border-bottom:1px solid var(--line)}
.fact .big{font-size:clamp(22px,2.3vw,32px);font-weight:600;letter-spacing:-.015em;line-height:1;min-width:3.2ch}
.fact .big.o{color:var(--accent)}
.fact .txt{font-size:14px;color:var(--muted)}
.fact .txt b{color:var(--ink);font-weight:600}
.fact .linkbtn{color:var(--accent);font-size:13px;margin-left:4px}
.fact.phonly{display:none}
@media (max-width:820px){.fact.phonly{display:grid}}
.lownames{overflow-y:auto;flex:1;min-height:0;font-size:13px;color:var(--muted);line-height:1.6}
.lownames span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin:0 4px 4px 0;color:var(--ink);background:var(--surface)}
.lownames span.z{border-color:var(--saffron);color:var(--saffron)}
.itab{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--ink);padding-top:8px}
.itab .panelhead{flex-wrap:nowrap}
.itab .fchips{flex:1;min-width:0}
.tbwrap{flex:1;min-height:0;overflow-y:auto}
.it{width:100%;border-collapse:collapse;font-size:14px}
.it th{position:sticky;top:0;background:var(--paper);font-weight:400;color:var(--muted);font-size:12.5px;text-align:right;padding:5px 0 5px 12px;z-index:1}
.it th:nth-child(2),.it td:nth-child(2){text-align:left;padding-left:4px}
.it th:first-child,.it td:first-child{text-align:left;padding-left:0;width:28px;color:var(--muted)}
.it td{padding:5px 0 5px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.it td.nmc{white-space:normal}
.it td.nmc small{display:block;color:var(--muted);font-size:12px}
.it .dv{width:clamp(120px,22vw,300px)}
.dvb{position:relative;height:16px;display:flex;align-items:center}
.dvb::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted)}
.dvb i{position:absolute;height:9px;border-radius:2px;top:3.5px}
.dvb i.p{left:50%;background:var(--accent)} .dvb i.n{right:50%;background:var(--saffron)}
.it td.vs{font-weight:600;min-width:52px}
.it td.vs.p{color:var(--accent)} .it td.vs.n{color:var(--saffron)}
@media (max-width:820px){
  .pA{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:8px}
  .fact{padding:4px 0;gap:8px}.fact .big{font-size:19px}.fact .txt{font-size:12.5px}
  .side .low{display:none}
  .it{font-size:12.5px}.it .dv,.it .hidem{display:none}.it td,.it th{padding-left:8px}
  .itab .panelhead{flex-direction:column;align-items:stretch;gap:6px}
  .itab .fchips{flex:none}
  #itnote{font-size:12px}
}


.pr1{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(12px,2.4vw,36px)}
.prl{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--ink);padding-top:8px;gap:6px}
#waves{width:100%;height:clamp(90px,17vh,150px);display:block;flex:none}
.pcats{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between}
.pcrow{display:grid;grid-template-columns:minmax(0,11em) 1fr 9.5em;gap:10px;align-items:center;font-size:13.5px;padding:2px 0}
.pcrow .bt{height:10px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.pcrow .bt i{background:var(--accent);display:block;height:100%}
.pcrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcrow .rt{text-align:right;color:var(--muted);white-space:nowrap}
.pcrow .rt b{color:var(--ink);font-weight:600}
.prr{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--ink);padding-top:8px;gap:6px}
.prr .panelhead{flex-wrap:nowrap}.prr .fchips{flex:1;min-width:0}
.it.pt th:first-child,.it.pt td:first-child{width:auto;color:var(--ink);text-align:left}
.it.pt th:nth-child(2),.it.pt td:nth-child(2){text-align:right;padding-left:12px}
.it.pt td.nmc small{max-width:34ch}
tr.click{cursor:pointer}tr.click:hover td{background:var(--accent-soft)}
.pup{color:var(--accent);font-weight:600}.pdn{color:var(--saffron);font-weight:600}
.pr2{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr) minmax(0,4fr);gap:clamp(12px,2.2vw,32px)}
.prc,.prv,.wif{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--ink);padding-top:8px;gap:8px}
#effchart{flex:1;min-height:0;width:100%;display:block}
.vb{display:grid;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.vb .l{font-size:13.5px}.vb .v{font-size:clamp(22px,2.2vw,30px);font-weight:600;letter-spacing:-.01em}
.vb .bt{height:10px;background:var(--line);border-radius:3px;overflow:hidden}.vb .bt i{display:block;height:100%}
.vb .s{font-size:12.5px;color:var(--muted)}
.caveat{font-size:12.5px;color:var(--muted);margin:0}
.caveat.sm{display:none}
.wif .fchips{flex:none}
.wif .ctrl{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.wif input[type=range]{width:100%;accent-color:var(--accent)}
.wout{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.wout .big{font-size:clamp(24px,2.6vw,36px);font-weight:600;color:var(--accent);letter-spacing:-.015em;line-height:1.1}
.wout .s{font-size:13px;color:var(--muted)}
@media (max-width:820px){
  .pr1{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:8px}
  .prl .pcats,.prl .panelhead:nth-of-type(2){display:none}
  #waves{height:92px}
  .prr .panelhead{flex-direction:column;align-items:stretch}
  .pr2{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(110px,1fr) auto auto;gap:6px}
  .prc .legend{display:none}
  .prv .panelhead h2,.wif .panelhead h2{font-size:13px}
  .prv #volbars{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vb{padding:4px 0}.vb .v{font-size:18px}
  .wif .ctrl{font-size:12.5px}.wout{padding:6px 10px}.wout .big{font-size:22px}
  .caveat{font-size:11.5px}
  .caveat.lg,.vb .s{display:none}.caveat.sm{display:block}
  .pr2{grid-template-rows:minmax(116px,1fr) auto auto}
  .wif{gap:5px}.wout .s{font-size:12px}
}


.fgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px}
.fc{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:clamp(10px,1.8vh,18px) 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden;transition:border-color .15s}
.fc:hover{border-color:var(--accent)}
.fc .no{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.fc h3{margin:0;font-size:clamp(15px,1.3vw,18px);font-weight:600;line-height:1.2}
.fc .fig{font-size:clamp(19px,1.9vw,27px);font-weight:600;letter-spacing:-.01em;line-height:1.1;color:var(--accent)}
.fc .figs{font-size:13px;color:var(--muted)}
.fc .act{font-size:13.5px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.fc .act b{font-weight:600}
.conf{font-size:11.5px;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid}
.conf.h{color:#2E7D4F;border-color:#2E7D4F}.conf.m{color:var(--saffron);border-color:var(--saffron)}.conf.l{color:var(--muted);border-color:var(--muted)}
.fc.hyp{border-style:dashed;background:transparent}
.vt{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
.vt th{font-weight:400;color:var(--muted);font-size:12px;text-align:right;padding:4px 0 4px 10px}
.vt th:first-child,.vt td:first-child{text-align:left;padding-left:0}
.vt td{padding:5px 0 5px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.vt td:first-child{white-space:normal}
.vt tr.tot td{font-weight:600;border-top:1px solid var(--ink)}
.notes h4{margin:14px 0 4px;font-size:14px}
@media (max-width:820px){
  .fgrid{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:6px}
  .fc{padding:8px 10px;gap:3px;border-radius:10px}
  .fc h3{font-size:13px}.fc .fig{font-size:16px}.fc .figs{font-size:11.5px}
  .fc .act,.fc .phide{display:none}.fc .no{font-size:11px}.conf{font-size:10.5px;padding:1px 6px}
}

@media (prefers-reduced-motion:no-preference){.rank .track span{transition:width .35s ease}}

.csliders{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.csliders .ctrl{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.csliders input[type=range]{width:100%;accent-color:var(--accent)}
#costchart{flex:1;min-height:150px;width:100%;display:block}
.benchlab2{font-size:12px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.benchlab2::before{content:"";width:16px;height:9px;border-radius:2px;background:var(--line);border-left:2px solid var(--muted);border-right:2px solid var(--muted)}
.asmlab{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:10px}
.hero{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:clamp(8px,1.5vh,14px) 14px;display:flex;flex-direction:column;gap:2px}
.hero .l{font-size:13px;color:var(--muted)}
.hero .v{font-size:clamp(24px,2.8vw,38px);font-weight:600;letter-spacing:-.015em;line-height:1.05}
.hero .be{font-size:13.5px;margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.hero .be b{font-weight:600}
.ct{width:100%;border-collapse:collapse;font-size:13.5px}
.ct th{font-weight:400;color:var(--muted);font-size:12px;text-align:right;padding:4px 0 4px 10px}
.ct th:first-child,.ct td:first-child{text-align:left;padding-left:0}
.ct td{padding:5px 0 5px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.ct td.mn{font-weight:600}
.ct td.up{color:var(--saffron);font-weight:600}
@media (max-width:820px){
 #costs .pr1{grid-template-rows:minmax(248px,1fr) auto;gap:6px}
 #costchart{min-height:232px}
 #ctabhead,#ctab{display:none}
 #cnote,#ccav{display:none}
 #costs .prl,#costs .prr{overflow:hidden}
 #costs .panelhead{flex-wrap:wrap;gap:2px}
 #costs .asmlab{margin-left:0}
 .csliders{grid-template-columns:1fr;gap:2px}
 .hero .v{font-size:22px}
 .ct{font-size:12.5px}
 .ct td,.ct th{padding-left:6px}
}

.cwrap{flex:1;min-height:0;overflow:hidden}
#costs .pr1{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.pl col.c1{width:40%}.pl col.cn{width:15%}
.pl{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.pl th{font-weight:400;color:var(--muted);font-size:11.5px;text-align:right;padding:3px 0 3px 8px;border-bottom:1px solid var(--ink)}
.pl th:first-child,.pl td:first-child{text-align:left;padding-left:0}
.pl td{padding:4px 0 4px 8px;line-height:1.25;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pl tr.sub td{border-top:1px solid var(--line);font-weight:600}
.pl tr.res td{border-top:2px solid var(--ink);font-weight:600;font-size:15px}
.pl tr.ind td:first-child{padding-left:14px;color:var(--muted);font-style:italic}
.pl td.hi{color:var(--saffron);font-weight:600}
.pl td.lo{color:var(--accent)}
.pl td.nm{white-space:normal}
.gaps{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.gap{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12.5px}
.gap .gl{color:var(--muted)}
.gap .gv{font-weight:600;font-variant-numeric:tabular-nums}
.gap .gt{grid-column:1/3;height:8px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.gap .gt i{position:absolute;top:0;bottom:0;left:50%;background:var(--accent)}
.gap .gt i.up{background:var(--saffron)}
@media (max-width:820px){
 #costs .pr1{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:4px}
 #costs .prr{display:none}
 .pl .hidem{display:none}
 .pl{table-layout:auto}
 .pl col{width:auto}
 .pl{font-size:11.5px}
 .pl td,.pl th{padding:2px 0 2px 5px}
 .pl tr.res td{font-size:12.5px}
 .pl tr.ind{display:none}
}

#costs .cpage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
#costs .cwrap{flex:1;min-height:0;overflow:hidden;border-top:1px solid var(--ink);padding-top:6px}
.pl{width:100%;border-collapse:collapse;font-size:17px;table-layout:fixed}
.pl th{font-weight:400;color:var(--muted);font-size:13px;text-align:right;padding:4px 0 6px 10px;border-bottom:1px solid var(--line)}
.pl th:first-child,.pl td:first-child{text-align:left;padding-left:0}
.pl td{padding:7px 0 7px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.25}
.pl tr.sub td{border-top:1px solid var(--line);font-weight:600}
.pl tr.res td{border-top:2px solid var(--ink);font-weight:600}
.pl td.nd{color:var(--muted)}
.pl td.hi{color:var(--saffron);font-weight:700}
.pl td.ok{color:var(--accent);font-weight:600}
.pl td.nm{white-space:normal}
.cstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cbox{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.cbox .l{font-size:12.5px;color:var(--muted)}
.cbox .v{font-size:clamp(20px,2.2vw,30px);font-weight:600;letter-spacing:-.015em;line-height:1.1}
.cbox .s{font-size:12.5px;color:var(--muted)}
@media (max-width:820px){
 .pl{font-size:11.5px;table-layout:auto}
 .pl td,.pl th{white-space:nowrap}
 .pl col{width:auto}
 .pl td,.pl th{padding:3px 0 3px 6px}
 .pl .hidem{display:none}
 #costs .cpage{gap:6px}
 .cstrip{grid-template-columns:1fr;gap:5px}
 .cbox{padding:5px 10px}
 .cbox .v{font-size:17px}
 .cbox .s{display:none}
}

.plkey{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.pl sup{font-size:9.5px;color:var(--muted);font-weight:400}
@media (max-width:820px){.plkey{font-size:10px;margin-top:5px}}
</style>
</head>
<body>
<section class="page" id="overview" aria-labelledby="h1">
  <div class="top">
    <div class="brand"><b data-t="brand"></b><span data-t="section"></span></div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="nl" aria-pressed="false">NL</button>
    </div>
  </div>
  <div class="head">
    <h1 id="h1"><span id="headline"></span><small id="range"></small></h1>
    <div class="controls">
      <div class="chips" data-chips role="group"></div>
    </div>
  </div>
  <div class="main">
    <div class="kpis" id="kpis"></div>
    <div class="right">
      <div class="chart">
        <div class="panelhead">
          <h2 id="charttitle"></h2>
          <div class="seg" role="group" id="measure">
            <button type="button" data-m="rev" aria-pressed="true" data-t="rev"></button>
            <button type="button" data-m="qty" aria-pressed="false" data-t="qty"></button>
          </div>
        </div>
        <svg id="bars" role="img" preserveAspectRatio="none"></svg>
        <div class="legend"><span><i style="background:var(--accent)"></i><span data-t="lgBest"></span></span><span><i style="background:var(--saffron)"></i><span data-t="lgWorst"></span></span><span><i style="background:var(--bar-off)"></i><span data-t="lgOut"></span></span></div>
      </div>
      <div class="rank" id="rank">
        <div class="panelhead">
          <h2 id="ranktitle"></h2>
          <div class="seg" role="group" id="dir">
            <button type="button" data-d="top" aria-pressed="true" data-t="top"></button>
            <button type="button" data-d="bottom" aria-pressed="false" data-t="bottom"></button>
          </div>
        </div>
        <ol id="ranklist"></ol>
        <div class="offer" id="offer"></div>
      </div>
    </div>
  </div>
  <div class="foot"><span class="src" data-t="src"></span><button type="button" class="linkbtn" id="aboutbtn" data-t="about"></button></div>
</section>

<section class="page" id="menu-glance" aria-labelledby="hAhead">
  <div class="top">
    <div class="brand"><b data-t="brand"></b><span data-t="sectionA"></span></div>
    <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="nl">NL</button></div>
  </div>
  <div class="head">
    <h1 id="hAhead" class="h1s"><span id="pAh"></span><small id="pAs"></small></h1>
    <div class="controls"><div class="chips" data-chips role="group"></div></div>
  </div>
  <div class="pA">
    <div class="pc">
      <div class="panelhead"><h2 id="pcTitle"></h2>
        <div class="seg" role="group" id="pmeas"><button type="button" data-pm="r" data-t="rev"></button><button type="button" data-pm="q" data-t="qty"></button></div></div>
      <svg id="pareto" role="img"></svg>
    </div>
    <div class="side">
      <div class="facts" id="facts"></div>
      <div class="low">
        <div class="panelhead"><h2 data-t="lowTitle"></h2></div>
        <div class="ctrl"><label for="thr" id="thrlab"></label><input type="range" id="thr" min="1" max="15" step="1" value="3"></div>
        <div class="lsum" id="lsum"></div>
        <div class="lownames" id="lowlist"></div>
      </div>
    </div>
  </div>
  <div class="foot"><span class="src" data-t="src2"></span><button type="button" class="linkbtn" data-about data-t="about"></button></div>
</section>

<section class="page" id="menu-cats" aria-labelledby="h2head">
  <div class="top">
    <div class="brand"><b data-t="brand"></b><span data-t="section2"></span></div>
    <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="nl">NL</button></div>
  </div>
  <div class="head">
    <h1 id="h2head" class="h1s"><span id="p2h"></span><small id="p2s"></small></h1>
    <div class="controls"><div class="chips" data-chips role="group"></div></div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="foot"><span class="src" data-t="src2"></span><button type="button" class="linkbtn" data-about data-t="about"></button></div>
</section>

<section class="page" id="menu-items" aria-labelledby="h3head">

    <div class="brand"><b data-t="brand"></b><span data-t="section3"></span></div>
    <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="nl">NL</button></div>
  </div>
  <div class="head">
    <h1 id="h3head" class="h1s"><span id="p3h"></span><small id="p3s"></small></h1>
    <div class="controls"><div class="chips" data-chips role="group"></div></div>
  </div>
  <div class="itab">
    <div class="panelhead">
      <div class="fchips" id="fchips" role="group"></div>
      <div class="seg" role="group" id="isort"><button type="button" data-is="r" data-t="sRev"></button><button type="button" data-is="q" data-t="sQty"></button><button type="button" data-is="u" data-t="sVs"></button></div>
    </div>

    <div class="sumline" id="itnote"></div>
  </div>
  <div class="foot"><span class="src" data-t="src2"></span><button type="button" class="linkbtn" data-about data-t="about"></button></div>

<section class="page" id="price-what" aria-labelledby="hP1">
  <div class="top">
    <div class="brand"><b data-t="brand"></b><span data-t="sectionP1"></span></div>
    <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="nl">NL</button></div>
  </div>
  <div class="head"><h1 id="hP1" class="h1s"><span id="pP1h"></span><small id="pP1s"></small></h1></div>
  <div class="pr1">
    <div class="prl">
      <div class="panelhead"><h2 data-t="wavesT"></h2></div>
      <svg id="waves" role="img"></svg>
      <div class="panelhead"><h2 data-t="catT"></h2></div>
      <div id="pcats" class="pcats"></div>

    <div class="prr">
      <div class="panelhead"><div class="fchips" id="pfchips" role="group"></div>

      <div class="tbwrap" id="plist"></div><div class="sumline" data-t="tapHint"></div>

<section class="page" id="price-effect" aria-labelledby="hP2">
  <div class="top">
    <div class="brand"><b data-t="brand"></b><span data-t="sectionP2"></span></div>
    <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="nl">NL</button></div>
  </div>
  <div class="head"><h1 id="hP2" class="h1s"><span id="pP2h"></span><small id="pP2s"></small></h1></div>
  <div class="pr2">
    <div class="prc">
      <div class="panelhead"><h2 data-t="effT"></h2></div>
      <svg id="effchart" role="img"></svg>

  <div class="head"><h1 id="hF" class="h1s"><span data-t="fH"></span><small data-t="fS"></small></h1></div>

<section class="page" id="costs" aria-labelledby="hC">
  <div class="top">
    <div class="brand"><b data-t="brand"></b><span data-t="sectionC"></span></div>

  {sub:"Issues found while preparing this report.",
   list:["Off-menu items, such as the ice creams and regional drinks, sit in 'No Group' instead of a menu group.","The till group 'Pannenkoeken' holds pancake toppings, while the pancakes themselves are in 'Hoofdgerechten'.","Duplicate buttons for the same product, for example Frits and Friet.","Jupiler Draft is on the menu but has no sales; Vedett from the tap sells every month but is not on the menu."],
   next:"Next step for deeper analysis: export the number of receipts (average spend per guest), sales per hour (staff planning) and food costs (profit per dish)."},
  {sub:"A hypothesis, not a finding.",
   p:(m,mn,le,d,f)=>[`The median item sold costs ${m}. The average revenue per item sold is ${mn}; leaving out the few items above €20 (bottles, sharing platter) makes it €5.47. The cheapest standard drinks (coffee, tea, soft drinks, water) cost €3.50.`,`${le} of all items sold cost €4.50 or less, and ${d} are drinks. Sales are also strongly seasonal: the best month was about four times the weakest.`,`This fits a café that guests visit mainly for its location: a drink, sometimes something small. But food and desserts still bring in ${f} of revenue, and the data counts items, not guests; it cannot show whether one guest buys a coffee alone or a coffee with a pancake.`],
   test:"To test it: export the number of receipts and the average spend per receipt, ideally per hour and per season."}],
 sectionC:"Part 5: the cost structure",
 pCh:(s,n)=>`Staff cost ${s} of net revenue against a benchmark of ${n}`,
 pCs:"Six cost groups for a caf\u00e9-restaurant. Only staff and rent are known for this business; the rest is not in the data.",
 pCsS:"Six cost groups. Only staff and rent are known here.",
 plL:"Cost group",plB:"Benchmark",plO:"This business",
 plKey:"a Sligro, kengetallen 2025 \u00b7 b Sligro, kengetallen 2025: full-service restaurant 30\u201335%, middle of the band 33%; Rabobank puts the sector today at 36\u201340% (September 2025) \u00b7 c sector profit and loss 2022, CBS via Firmfocus: overhead is equipment 1.5% + transport 0.8% + communication 0.4% + depreciation 4.2% + other services 1.6% + other operating costs 4.7%",
 cRows:{rev:"Net revenue, excl. VAT",cogs:"Purchasing, food and drink",staff:"Staff, all charges included",mkt:"Marketing",rent:"Rent and service charges",energy:"Energy",over:"Overhead: equipment, depreciation, insurance, admin, bank and other services",tot:"Total costs",res:"Operating result"},
 cRowsS:{rev:"Net revenue",cogs:"Purchasing",staff:"Staff",mkt:"Marketing",rent:"Rent",energy:"Energy",over:"Overhead",tot:"Total costs",res:"Operating result"},
 overTip:"Equipment and inventory 1.5% + transport 0.8% + communication 0.4% + depreciation 4.2% + other services 1.6% + other operating costs 4.7% = 13.2% (CBS sector 2022)",
 cb1:"Staff and rent together",cb1s:"benchmark: 39\u201341%",
 cb2:"Left for everything else",cb2s:"purchasing, marketing, energy and overhead need 46.9\u201351.9%",
 cb3:"Result if the other lines ran at benchmark",cb3s:"nothing left for the owner, before tax and interest",
 ccav:"Only two lines are measured: staff (hours sheet \u00d7 \u20ac21 an hour, all charges included) and rent. Purchasing, marketing, energy and overhead are not in the data, so they are left blank rather than guessed. Management hours are missing from the hours sheet, so the real staff cost is higher than 55.2%.",
 srcC:"Sources: till reports and the hours sheet, April to August 2026; rent and hourly cost from the owner; benchmarks as marked under the table.",
 aboutTitle:"About the data",
 notes:["All figures come from the till's monthly sales reports (DISH POS), July 2025 to August 2026. September 2026 is left out because it was still running when the data was exported.",
 "The monthly reports used here were exported with an end time of 06:00 on the last day of each month, so the last day of every month is missing (about 3.5% of sales when compared with the till's full-period total). Daily averages divide by the days that are actually covered, not by calendar days.",
 "The restaurant opened in July 2025. July 2025 is shown but never counts as a strongest or weakest month, because it is not a full month.",
 "All prices include VAT (BTW), as the guest pays them.",
 "Public version: to protect the business, revenue and item counts are shown as shares, growth rates and indices, not as euros or totals. Menu prices are public and shown as they are.",
 "Items sold counts products only; revenue per item leaves out toilet fees, group-booking deposits and a few unnamed till items, so it matches part 2. Add-ons (sauces, toppings, extra shot, plant milk, extra bread with Signature Starter), toilet fees and group-booking deposits are left out of the count and the rankings, but their money is included in revenue.",
 "Product names follow the restaurant's online menu (English) and printed menu (Dutch). Till buttons for the same menu line are combined everywhere in the report, for example a pancake with a topping, or Coca-Cola and Coca-Cola Zero, so rankings match across pages.",
 "Menu sections follow the restaurant's website. Signature Starter and House Dessert appear in two sections there and count under Signature Dishes. Extra shot is listed on the website as an item but counts here as an add-on to a coffee.",
 "Add-ons count toward their section's revenue but not its item count. Off-menu items have their own card. Toilet fees, group-booking deposits and other items are left out of the menu pages.",
 "Rarely ordered items are measured per month from the first month an item sold, so new items are not penalised for months they were not on sale.",
 "Prices (part 3) are read from the till: revenue divided by items sold, per till button and month. A month that sits between two prices is the month the price changed. Items first sold after a price round, with no sales in March 2026, are counted in the March round. The price effect compares April to August 2026 with the same items at their February 2026 price; new items and off-menu items count at their actual revenue.",
 "Part 5 groups the costs of a café-restaurant into six lines. Only two of them are known for this business: staff (hours sheet at €21 an hour, all charges included) and rent; the other lines are left blank because the figures are not in the data. The staff benchmark of 33% is the middle of the 30 to 35% band that Sligro's kengetallen 2025 give for a full-service restaurant. It is a norm to aim at, not what the sector actually pays today: Rabobank put the sector at 36 to 40% of turnover in September 2025. Purchasing and rent come from Sligro's kengetallen 2025; marketing, energy and overhead are taken from the 2022 sector profit and loss (CBS figures published by Firmfocus), where overhead is the sum of equipment, transport, communication, depreciation, other services and other operating costs. Management hours are missing from the hours sheet, so staff cost is understated.",
 "In this public version the sales figures inside the file are scaled by a single constant, so that total revenue over the whole period equals 1,000 index points. Every share, ratio, growth rate, per-item price and per-month sales rate shown in the report is exact and unchanged; absolute revenue and item counts cannot be recovered from the file."]},

function drawChart(sel,[best,worst]){
  const svg=$("bars"),W=Math.max(200,svg.clientWidth),H=Math.max(70,svg.clientHeight),pb=30,pt=6,n=DATA.months.length,gap=W<420?4:8,bw=(W-gap*(n-1))/n;
  const vals=MT.map(m=>st.m==="rev"?m.e:m.q),max=Math.max(...vals);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const t=T[st.lang];
  let s=`<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--bar-off)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--muted)" stroke-width="2"/></pattern></defs>`;
  vals.forEach((v,j)=>{
    const h=(H-pb-pt)*v/max,x=j*(bw+gap),y=H-pb-h,insel=sel.includes(j);
    let fill=insel?"var(--bar)":"var(--bar-off)";
    if(!DATA.months[j].full&&insel)fill="url(#hatch)";
    if(j===best)fill="var(--accent)";if(j===worst)fill="var(--saffron)";
    const fa=DATA.months.map((_,k)=>k).filter(k=>DATA.months[k].full),avgv=fa.reduce((s,k)=>s+vals[k],0)/fa.length,lbl=Math.round(v/avgv*100);
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${fill}"><title>${mName(j,true)}: ${lbl}${DATA.months[j].full?"":" ("+(st.lang==="nl"?"deel van de maand":"partial month")+")"}</title></rect>`;
    s+=`<text x="${x+bw/2}" y="${H-pb+15}" text-anchor="middle" font-size="12" fill="var(--muted)">${mShort(j)}</text>`;
  });
  s+=`<text x="0" y="${H-2}" font-size="11.5" fill="var(--muted)">2025</text><text x="${6*(bw+gap)}" y="${H-2}" font-size="11.5" fill="var(--muted)">2026</text>`;
  s+=`<line x1="${6*(bw+gap)-gap/2}" x2="${6*(bw+gap)-gap/2}" y1="${pt}" y2="${H-pb+18}" stroke="var(--line)"/>`;
  svg.innerHTML=s;
  svg.setAttribute("aria-label",(st.m==="rev"?t.chartRev:t.chartQty));
}

  const all=PERIODS.all,{cats,TQ,TR,lines}=catData(all);
  const byR=[...lines].sort((a,b)=>b.r-a.r),rk=byR.findIndex(l=>l.en==="House Soup")+1;
